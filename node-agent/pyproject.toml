[project]
name = "ramx-node"
version = "0.0.0"
description = "node agent (SPEC §4): node key, registration link, signed heartbeats"
requires-python = ">=3.12,<3.13"
dependencies = ["eth-account>=0.13,<0.14", "httpx>=0.27,<0.29"]

[project.scripts]
ramx-node = "ramx_node.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ramx_node"]

[tool.pytest.ini_options]
testpaths = ["tests"]

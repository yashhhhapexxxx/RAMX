packages:
  - shared
  - gateway
  - frontend
  - agent-client
  - swarm-sim

allowBuilds:
  better-sqlite3: true
  # bufferutil / utf-8-validate (via a wallet's WebSocket client) are optional; it falls back to pure JS.
  bufferutil: false
  esbuild: true
  # secp256k1 (via @near-js) falls back to its pure-JS implementation; no native build needed.
  secp256k1: false
  utf-8-validate: false

[package]
name = "ramx-escrow"
version = "0.1.0"
edition = "2021"
description = "RAMX guarded agent wallet: an owner funds USDC for an agent; the agent can only pay within the owner's policy"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
